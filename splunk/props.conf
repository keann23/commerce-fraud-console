# Copy into $SPLUNK_HOME/etc/apps/<your_app>/local/props.conf (or set the same values in the
# "Add Data" wizard). Every exported file is JSON lines with an ISO timestamp in the "ts" field.

[fraud:payments]
INDEXED_EXTRACTIONS = json
TIMESTAMP_FIELDS = ts
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
KV_MODE = none
SHOULD_LINEMERGE = false

